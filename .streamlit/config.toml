[theme]
base            = "dark"
primaryColor    = "#7c8cf8"
backgroundColor = "#0d0d1f"
secondaryBackgroundColor = "#1e1e3a"
textColor       = "#c0c0e0"
font            = "sans serif"

[server]
headless        = true
enableCORS      = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
